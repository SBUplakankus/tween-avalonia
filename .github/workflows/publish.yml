name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400-preview.0.26322.102"

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(dotnet msbuild src/TweenAvalonia/TweenAvalonia.csproj -getProperty:Version -nologo)
          if [ "$PACKAGE_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build
        run: dotnet build TweenAvalonia.slnx -c Release

      - name: Test
        run: dotnet test TweenAvalonia.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/TweenAvalonia/TweenAvalonia.csproj -c Release --no-build -o artifacts

      - name: Get NuGet token
        id: nuget_token
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('api.nuget.org');
            const response = await fetch('https://api.nuget.org/v3/oidc/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: idToken, source: 'github-actions' }),
            });
            const data = await response.json();
            core.setOutput('token', data.token);

      - name: Publish to NuGet
        env:
          NUGET_AUTH_TOKEN: ${{ steps.nuget_token.outputs.token }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json
