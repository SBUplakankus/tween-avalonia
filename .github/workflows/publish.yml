name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400-preview.0.26322.102"

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(dotnet msbuild src/TweenAvalonia/TweenAvalonia.csproj -getProperty:Version -nologo)
          if [ "$PACKAGE_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build
        run: dotnet build TweenAvalonia.slnx -c Release

      - name: Test
        run: dotnet test TweenAvalonia.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/TweenAvalonia/TweenAvalonia.csproj -c Release --no-build -o artifacts

      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: SBUplakankus

      - name: Publish to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
