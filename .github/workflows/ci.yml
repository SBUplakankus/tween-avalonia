name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400-preview.0.26322.102"

      - name: Build
        run: dotnet build TweenAvalonia.slnx -c Release

      - name: Test
        run: dotnet test TweenAvalonia.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/TweenAvalonia/TweenAvalonia.csproj -c Release --no-build -o artifacts
